<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Wearable Tiles</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Each screen is a full-page section -->
    <div id="home" class="screen">
      <div class="content data-grid">
        <div class="tile-doc card focusable">
          <img class="tile-img" src="../tile-sources/0405中.svg" alt="Red Dragon"/>
          <label class="tile-label">Red Dragon</label>
        </div>
        <div class="tile-doc card focusable">
          <img class="tile-img" src="../tile-sources/0405中.svg" alt="Green Dragon"/>
          <label class="tile-label">Green Dragon</label>
        </div>
        <div class="tile-doc card focusable">
          <img class="tile-img" src="../tile-sources/0405中.svg" alt="White Dragon"/>
          <label class="tile-label">White Dragon</label>
        </div>
      </div>
      <nav class="nav-bar">
        <button class="nav-item focusable" data-action="action-name">Label</button>
      </nav>
    </div>

    <!-- Additional screens start hidden -->
    <div id="settings" class="screen hidden">
      <header class="header">
        <button class="back-btn focusable" data-action="back">&#8592;</button>
        <h1>Settings</h1>
      </header>
      <div class="content">
        <!-- Detail content -->
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
